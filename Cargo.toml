[package]
name = "btdui"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Sampling disk usage profiler for btrfs with a GPU-accelerated GUI"
repository = "https://github.com/mickaelmagniez/btdui"

[dependencies]
btrfs-uapi = "0.13"
gpui = "0.2.2"
# libc >= 0.2.190 drops ENOATTR on Linux, which breaks xattr 0.2 (pulled in by gpui).
libc = ">=0.2.182, <0.2.190"
nix = "0.31"
rand = "0.9"
